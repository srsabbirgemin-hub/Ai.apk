name: Build and Release SRS APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build srs.apk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            echo "Generating Gradle Wrapper..."
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Create Mock/Placeholder Keys if needed
        run: |
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi

      - name: Build Android Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Prepare srs.apk
        run: |
          mkdir -p output-apk
          APK_FILE=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          if [ -f "$APK_FILE" ]; then
            echo "Found APK: $APK_FILE"
            cp "$APK_FILE" output-apk/srs.apk
            cp "$APK_FILE" output-apk/app-debug.apk
            echo "Successfully prepared output-apk/srs.apk"
          else
            echo "Error: APK not found!"
            exit 1
          fi

      - name: Upload srs.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: srs-apk
          path: output-apk/srs.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'latest-build' }}
          name: "SRS Assistant APK (${{ github.ref_name || 'Latest' }})"
          body: |
            ## SRS Android App Release (srs.apk)
            
            This is the direct APK build for the SRS Android application.
            
            - **File Name:** `srs.apk`
            - **Developer:** [Siddik9980](https://www.facebook.com/Siddik9980)
            - **Official Page:** [SRS Sabbir Page](https://www.facebook.com/profile.php?id=61557614412925)
            - **Telegram Channel:** [t.me/SRSabbir](https://t.me/SRSabbir)
            - **YouTube Channel:** [@SRSabbir9980](https://www.youtube.com/@SRSabbir9980)
            
            ### Installation:
            1. Download `srs.apk` below.
            2. Enable "Install Unknown Apps" in Android Settings if prompted.
            3. Open and install!
          files: output-apk/srs.apk
          fail_on_unmatched_files: false
